<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>التحقق من الوثيقة الرسمية</title><style>body{margin:0;background:#eef3f7;font-family:Tahoma,Arial;color:#102a43}.wrap{max-width:760px;margin:70px auto;padding:20px}.card{background:#fff;border:1px solid #d8e1e8;border-radius:18px;padding:30px;box-shadow:0 16px 40px #1232}.head{border-bottom:4px solid #1d659a;padding-bottom:18px;margin-bottom:22px}.ok{display:inline-block;background:#e7f6ee;color:#087443;padding:8px 13px;border-radius:999px;font-weight:800}.bad{background:#fdecea;color:#b42318}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.item{background:#f6f9fb;border-radius:10px;padding:13px}.item small{display:block;color:#667085;margin-bottom:5px}.id{font-family:monospace;font-size:11px;word-break:break-all}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="card"><div class="head"><h1>التحقق من الوثيقة الرسمية</h1><div id="state"></div></div><div id="data"></div></div></div><script>const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));const v=new URLSearchParams(location.search).get("v"),reports=JSON.parse(localStorage.getItem("v29_reports")||"[]"),forums=JSON.parse(localStorage.getItem("v29_forums")||"[]"),users=JSON.parse(localStorage.getItem("v29_users")||"[]"),r=reports.find(x=>x.verificationId===v),forum=id=>forums.find(f=>f.forumId===id||f.id===id)?.name||id||"-",user=id=>users.find(u=>u.userId===id||u.id===id)?.name||id||"-";if(!r){state.innerHTML='<span class="ok bad">تعذر التحقق من الوثيقة</span>';data.innerHTML='<p>معرف التحقق غير موجود في سجل هذه النسخة المحلية.</p>'}else{state.innerHTML='<span class="ok">'+(r.status==="صادر"&&r.isCurrent!==false?"تم التحقق — وثيقة سارية":"تم العثور على الوثيقة — "+esc(r.status))+'</span>';data.innerHTML='<div class="grid"><div class="item"><small>رقم التقرير</small><b>'+esc(r.id)+'</b></div><div class="item"><small>المنتدى</small><b>'+esc(forum(r.forumId||r.forum))+'</b></div><div class="item"><small>تاريخ التقرير</small><b>'+esc((r.createdAt||"").slice(0,10))+'</b></div><div class="item"><small>الإصدار</small><b>V'+esc(r.version)+'</b></div><div class="item"><small>الحالة</small><b>'+esc(r.status)+'</b></div><div class="item"><small>كاتب التقرير</small><b>'+esc(r.reportWriterName||user(r.writerUserId||r.createdBy))+'</b></div><div class="item"><small>المعتمد</small><b>'+esc(user(r.approvedByUserId||r.approvedBy))+'</b></div><div class="item"><small>صلاحية النسخة</small><b>'+(r.isCurrent===false?"مستبدلة بإصدار أحدث":"النسخة السارية")+'</b></div><div class="item" style="grid-column:1/-1"><small>Verification ID</small><span class="id">'+esc(r.verificationId)+'</span></div></div>'}</script></body></html>
